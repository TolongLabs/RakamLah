name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, audit, and capture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source and media
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Git LFS objects
        run: |
          test "$(git lfs ls-files -n | wc -l)" -eq 3
          git lfs fsck

      - name: Run behavior tests
        run: pnpm test

      - name: Run formatting and public-release gates
        run: pnpm lint

      - name: Check shell and Python syntax
        run: |
          find . -type f -name '*.sh' -not -path './node_modules/*' -exec bash -n {} +
          python3 -m compileall -q engine tests/python

      - name: Validate the neutral example
        run: node bin/rakam.mjs validate --config examples/basic/rakam.config.mjs --json

      - name: Record the neutral browser smoke
        run: |
          set +e
          capture_json="$(node bin/rakam.mjs capture --config examples/basic/rakam.config.mjs --json)"
          capture_status="$?"
          set -e
          printf '%s\n' "$capture_json"
          test "$capture_status" -eq 0
          run_dir="$(node -e 'const value=JSON.parse(process.argv[1]); if (!value.ok) process.exit(1); process.stdout.write(value.runDir)' "$capture_json")"
          test -s "$run_dir/capture.webm"
          test -s "$run_dir/beats.json"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$run_dir/capture.webm"

      - name: Confirm the checkout stayed clean
        run: git diff --exit-code
