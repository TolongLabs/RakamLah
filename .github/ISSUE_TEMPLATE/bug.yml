name: Bug report
description: Report a reproducible defect in capture, narration, verification, or tooling.
title: '[Bug]: '
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, private frames, and unapproved voice samples.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and a synthetic config or scenario when possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Doctor output
      description: Paste redacted output from `rakam doctor --json`.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RakamLah version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node, Python, browser channel, FFmpeg
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add safe logs or media metadata. Do not upload sensitive recordings.
